[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-webhook-inbox"
version = "0.1.0"
description = "Offline durable inbox and replay lab for synthetic rail customer webhooks"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
rail-inbox = "rail_inbox.cli:main"

[tool.setuptools.packages.find]
include = ["rail_inbox*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["rail_inbox", "tests", "scripts"]
